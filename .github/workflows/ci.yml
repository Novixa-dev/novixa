name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real PostgreSQL for tests/postgres-store.integration.test.ts — the
    # leads store's SQL (migrations, FILTER aggregates, LIKE escaping) is only
    # proven against the engine production runs, not the in-memory store.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novixa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/novixa_test

      - name: Build
        run: npm run build
        env:
          # Pinned so the build is reproducible and the prerendered canonical
          # URLs in the artifact match production rather than the runner.
          NEXT_PUBLIC_SITE_URL: https://novixa.dev

      - name: Install Playwright browser
        # Only Chromium, and only its own deps — the suite runs one engine.
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
