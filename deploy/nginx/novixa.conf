# ==============================================================================
# novixa.dev — site block for mailcow's nginx.
#
# MANAGED BY CI: installed to <mailcow>/data/conf/nginx/novixa.conf by
# deploy/scripts/deploy.sh on every release. Edit it in the repository
# (deploy/nginx/novixa.conf), not on the server — a server-side edit is
# overwritten by the next deploy.
#
# mailcow's nginx includes every data/conf/nginx/*.conf and keeps them across
# mailcow updates. This file only answers for novixa.dev and www.novixa.dev;
# mailcow's own hostnames are matched by its own server blocks, so mail UI,
# autodiscover and ACME are untouched. deploy.sh runs `nginx -t` before every
# reload and restores the previous file if the test fails.
#
# Lines ending in "#ipv6" are dropped when mailcow's nginx has no IPv6 listener.
# ==============================================================================

# Plain HTTP → HTTPS on the apex. Cloudflare normally upgrades first; this is
# the origin's own guarantee.
server {
    listen 80;
    listen [::]:80; #ipv6
    server_name novixa.dev www.novixa.dev;
    return 301 https://novixa.dev$request_uri;
}

# www → apex: one canonical host, matching NEXT_PUBLIC_SITE_URL.
server {
    listen 443 ssl;
    listen [::]:443 ssl; #ipv6
    http2 on;
    server_name www.novixa.dev;

    ssl_certificate     /etc/nginx/conf.d/novixa/origin.pem;
    ssl_certificate_key /etc/nginx/conf.d/novixa/origin.key;

    return 301 https://novixa.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl; #ipv6
    http2 on;
    server_name novixa.dev;

    # Cloudflare Origin Certificate: trusted by Cloudflare only, which is the
    # point — with SSL mode "Full (strict)" the edge verifies it, and nothing
    # else should be talking to this origin over HTTPS.
    ssl_certificate     /etc/nginx/conf.d/novixa/origin.pem;
    ssl_certificate_key /etc/nginx/conf.d/novixa/origin.key;

    # The visitor's address. Every request arrives from a Cloudflare edge IP;
    # the real client is in CF-Connecting-IP, which is only believed when the
    # connection itself comes from one of Cloudflare's published ranges
    # (https://www.cloudflare.com/ips/). Anyone else sending that header
    # directly to the origin is ignored.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # The largest legitimate request is the project form (~24 KB, enforced
    # again by the API). Anything bigger is refused here, before Node sees it.
    client_max_body_size 64k;

    location / {
        # Resolved per request through Docker's DNS rather than at startup, so
        # mailcow's nginx still starts (and mail UI still works) when the app
        # container is down — this block then answers 502 instead.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $novixa_app http://novixa-app:3000;
        proxy_pass $novixa_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # OVERWRITTEN, never appended. The app rate-limits the contact form and
        # the admin login on the first X-Forwarded-For entry; if a client could
        # put its own value first, it could rotate past both limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
